# Serves the built React SPA and proxies /api to the backend container so
# the browser only ever talks to one origin — CORS never enters the picture.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;  # policy PDFs / resume uploads

    # SSE endpoints (/api/.../stream): no buffering, no read timeout, and an
    # HTTP/1.1 connection with the Connection header cleared so nginx doesn't
    # close the stream early. Matched ahead of the general /api block.
    location ~ ^/api/.*/stream$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Everything else under /api — same-origin proxy to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history fallback — client-side routing owns every other path.
    location / {
        try_files $uri /index.html;
    }
}
